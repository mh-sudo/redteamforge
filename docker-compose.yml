services:
  redteamforge:
    build: .
    image: redteamforge:local
    ports:
      # Loopback-only by default. To expose on your LAN/VPS, change to
      # "8080:8080" AND set AUTH_PASSWORD below — an open instance lets
      # anyone who can reach it use the server to call your providers.
      - "127.0.0.1:8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      # Required when exposing beyond localhost:
      # AUTH_PASSWORD: "change-me"
      # Allow https endpoints on private/LAN addresses (self-hosted models):
      # RTF_ALLOW_PRIVATE_ENDPOINTS: "1"
    restart: unless-stopped
